name: 🐛 Bug report
description: Something broke, crashed, or behaved unexpectedly
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report — LookSee is maintained by one person, and good reports are what keep it sharp.

        **⚠️ Security problem? Do not file it here.** Anything that could let malware or another user abuse LookSee's own machinery belongs in private reporting — see [SECURITY.md](../../blob/main/SECURITY.md).

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      description: Most reports are solved by one of these.
      options:
        - label: I'm running the latest build from the [Releases page](../../releases)
        - label: I ran LookSee **as Administrator** (the feeds need elevation to see everything)

  - type: dropdown
    id: windows-version
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10 (19041+)
        - Windows 10 (older)
        - Not sure
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: LookSee build
      description: Shown in the status bar, bottom right (or the release zip filename, e.g. v1.0.0).
      placeholder: "v1.0.0"
    validations:
      required: true

  - type: dropdown
    id: tab
    attributes:
      label: Where did it happen?
      options:
        - Who's Talking
        - Phone Bill
        - Who Started It — Scheduled Tasks feed
        - Who Started It — Python feed
        - Who Started It — svchost Timeline feed
        - Deliveries
        - Black Hole
        - Defender
        - Privacy
        - Windows Check-Ins
        - Recorder
        - Whole app / startup
        - Somewhere else
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you clicked, what you expected, what actually happened. Screenshots help — drag them in.
      placeholder: I opened the … tab, clicked …, and instead of … it …
    validations:
      required: true

  - type: dropdown
    id: sysmon
    attributes:
      label: Was Sysmon installed?
      description: Several feeds get their data from Sysmon — if it wasn't installed yet, that changes the diagnosis.
      options:
        - Yes, installed from the Recorder tab
        - No, not installed
        - Not sure

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional, but it speeds everything up)
      description: |
        Everything LookSee remembers is readable JSON/text on disk. Paste excerpts of whatever looks relevant — **never paste TLS plaintext or key files** (`sslkeys.log`, `trace-*.jsonl`, `flows\*.jsonl`, `bodies\` may contain secrets from your own traffic):

        - `C:\ProgramData\LookSee\onesettings-cadence\` — `state.json`, `audit.jsonl`
        - The app's own folder — `telemetry_proof.jsonl`, `ignored_processes.txt`, `check_interval.txt`
        - `%LOCALAPPDATA%\LookSee\pytrace\` — Python feed settings/state (not the key files above)
      render: shell
